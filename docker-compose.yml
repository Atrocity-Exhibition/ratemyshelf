services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ratemyshelf
      POSTGRES_PASSWORD: ratemyshelf
      POSTGRES_DB: ratemyshelf
    ports:
      - "5432:5432"
    volumes:
      - ratemyshelf-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratemyshelf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ratemyshelf-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - ratemyshelf-meili:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ratemyshelf-pg:
  ratemyshelf-redis:
  ratemyshelf-meili:
