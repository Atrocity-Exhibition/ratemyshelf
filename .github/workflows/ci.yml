name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ratemyshelf
          POSTGRES_PASSWORD: ratemyshelf
          POSTGRES_DB: ratemyshelf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ratemyshelf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ratemyshelf:ratemyshelf@localhost:5432/ratemyshelf
      REDIS_URL: redis://localhost:6379
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_API_KEY: masterKey
      NEXT_PUBLIC_MEILISEARCH_HOST: http://localhost:7700
      NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY: searchKey
      AUTH_SECRET: ci-secret-ci-secret-ci-secret
      SKIP_ENV_VALIDATION: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - run: pnpm db:migrate

      - name: Apply trigram indexes
        run: PGPASSWORD=ratemyshelf psql -h localhost -U ratemyshelf -d ratemyshelf -f packages/db/prisma/migrations/001_init/extras.sql

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
